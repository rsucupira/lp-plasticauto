name: Adicionar assinatura Uebey

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-uebey-credit.yml'

permissions:
  contents: write

jobs:
  update-credit:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Inserir assinatura Uebey
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          credit = '''<a class="uebey-credit" href="https://uebey.com" target="_blank" rel="noopener noreferrer" aria-label="Desenvolvido por Uebey"><span class="uebey-credit__icon" aria-hidden="true"><svg viewBox="0 0 30 36" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 3v17c0 8 4.6 13 11 13s11-5 11-13V3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M8 5v15c0 5.5 2.9 9 7 9s7-3.5 7-9V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".76"/><path d="M12 7v13c0 2.8 1.2 4.7 3 4.7s3-1.9 3-4.7V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".52"/></svg></span><span>Desenvolvido por <strong>Uebey</strong></span></a>'''

          # Página principal
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'class="uebey-credit"' not in s:
              old = '<div class="container footer-bottom"><span>© 2026 Plasticauto. Todos os direitos reservados.</span><span>Catálogo técnico-comercial</span></div>'
              new = '<div class="container footer-bottom"><span>© 2026 Plasticauto. Todos os direitos reservados.</span><span>Catálogo técnico-comercial</span>' + credit + '</div>'
              if old not in s:
                  raise SystemExit('Rodapé da index não encontrado; abortando com segurança.')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          # Página de produto
          p = Path('produto.html')
          s = p.read_text(encoding='utf-8')
          if 'class="uebey-credit"' not in s:
              old = '<footer class="site-footer"><div class="container footer-bottom"><span>© 2026 Plasticauto.</span><a href="index.html">Página inicial</a></div></footer>'
              new = '<footer class="site-footer"><div class="container footer-bottom"><span>© 2026 Plasticauto.</span><a href="index.html">Página inicial</a>' + credit + '</div></footer>'
              if old not in s:
                  raise SystemExit('Rodapé de produto.html não encontrado; abortando com segurança.')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          # Estilo compartilhado
          p = Path('assets/css/styles.css')
          s = p.read_text(encoding='utf-8')
          if '.uebey-credit{' not in s:
              old = '.footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding-top:20px;display:flex;justify-content:space-between;color:#666b72;font-size:9px;text-transform:uppercase;letter-spacing:1px}'
              new = '.footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding-top:20px;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:24px;color:#666b72;font-size:9px;text-transform:uppercase;letter-spacing:1px}.uebey-credit{justify-self:end;display:inline-flex;align-items:center;gap:7px;color:#747980;text-transform:none;letter-spacing:.35px;white-space:nowrap;opacity:.82;transition:color .2s ease,opacity .2s ease}.uebey-credit__icon{width:16px;height:19px;display:inline-flex;color:var(--orange);filter:drop-shadow(0 0 7px rgba(255,90,31,.14))}.uebey-credit__icon svg{width:100%;height:100%;display:block}.uebey-credit strong{color:#9ba0a7;font-weight:600;transition:color .2s ease}.uebey-credit:hover{color:#c5c9ce;opacity:1}.uebey-credit:hover strong{color:var(--orange)}'
              if old not in s:
                  raise SystemExit('CSS do footer não encontrado; abortando com segurança.')
              s = s.replace(old, new, 1)
              old_mobile = '.footer-bottom{display:grid;gap:8px}'
              new_mobile = '.footer-bottom{display:grid;grid-template-columns:1fr;gap:8px}.uebey-credit{justify-self:end;margin-top:2px}'
              if old_mobile in s:
                  s = s.replace(old_mobile, new_mobile, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar alteração
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nada para publicar."
            exit 0
          fi
          git config user.name "Rodrigo Sucupira"
          git config user.email "64866757+rsucupira@users.noreply.github.com"
          git add index.html produto.html assets/css/styles.css
          git commit -m "Adicionar assinatura discreta da Uebey no rodapé"
          git push origin main
