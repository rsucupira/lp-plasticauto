name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - deployment-status.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Verify published site
        id: verify
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$PAGE_URL" -o published-page.html
          grep -q "Plasticauto" published-page.html

      - name: Record deployment status
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone

          deploy = os.environ.get('DEPLOY_OUTCOME', 'unknown')
          verify = os.environ.get('VERIFY_OUTCOME', 'not_run')
          status = 'online' if deploy == 'success' and verify == 'success' else 'failed'
          payload = {
              'status': status,
              'deployment': deploy,
              'http_verification': verify,
              'page_url': os.environ.get('PAGE_URL', ''),
              'source_commit': os.environ.get('COMMIT_SHA', ''),
              'checked_at_utc': datetime.now(timezone.utc).isoformat()
          }
          with open('deployment-status.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Publish deployment status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Registra status da publicação [skip ci]"
          git push

      - name: Fail when deployment is unavailable
        if: steps.deployment.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1
